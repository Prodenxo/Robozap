services:
  robozap:
    build: .
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      COBALT_API_URL: http://cobalt:9000/
      COBALT_PUBLIC_URL: https://api.cobalt.liubquanti.click
      YOUTUBE_SESSION_SERVER: "http://yt-session:8080"
      COBALT_SHARED_COOKIES_PATH: /data/cookies/cookies.json
      # Cookies NÃO são obrigatórios — só se YOUTUBE_USE_COOKIES=true
      NO_PROXY: "localhost,127.0.0.1,cobalt,yt-session,mysql,filhote-mysql"
      no_proxy: "localhost,127.0.0.1,cobalt,yt-session,mysql,filhote-mysql"
    depends_on:
      - cobalt
    restart: unless-stopped
    volumes:
      - ./yt-dlp-cache:/root/.cache/yt-dlp
      - youtube-cookies:/data/cookies
    networks:
      - robozap-net

  cobalt:
    image: ghcr.io/imputnet/cobalt:latest
    init: true
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      API_URL: http://cobalt:9000/
      API_PORT: "9000"
      RATELIMIT_WINDOW: "60"
      RATELIMIT_MAX: "30"
      YOUTUBE_SESSION_SERVER: "http://yt-session:8080"
      # Cookies compartilhados com o robozap (mesmo volume)
      COOKIE_PATH: /data/cookies/cookies.json
      # NÃO usar HTTP_PROXY quebrado no Cobalt
    depends_on:
      - yt-session
    volumes:
      - youtube-cookies:/data/cookies
    networks:
      - robozap-net

  yt-session:
    image: ghcr.io/imputnet/yt-session-generator:webserver
    init: true
    restart: unless-stopped
    mem_limit: 1280m
    networks:
      - robozap-net

volumes:
  youtube-cookies:

networks:
  robozap-net:
    driver: bridge
