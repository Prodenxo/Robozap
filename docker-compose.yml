services:
  robozap:
    build: .
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      COBALT_API_URL: http://cobalt:9000/
      YOUTUBE_USE_COOKIES: "false"
    depends_on:
      - cobalt
    restart: unless-stopped
    volumes:
      - ./yt-dlp-cache:/root/.cache/yt-dlp
    networks:
      - robozap-net

  cobalt:
    image: ghcr.io/imputnet/cobalt:latest
    init: true
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      API_URL: http://cobalt:9000/
      API_PORT: "9000"
      RATELIMIT_WINDOW: "60"
      RATELIMIT_MAX: "30"
      # Tokens automáticos (sem cookies manuais) — precisa do yt-session saudável
      YOUTUBE_SESSION_SERVER: "http://yt-session:8080"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      http_proxy: "${HTTP_PROXY:-}"
      https_proxy: "${HTTPS_PROXY:-}"
    depends_on:
      - yt-session
    networks:
      - robozap-net

  # Gera PO tokens pro Cobalt — evita atualizar cookies na mão
  yt-session:
    image: ghcr.io/imputnet/yt-session-generator:webserver
    init: true
    restart: unless-stopped
    networks:
      - robozap-net

networks:
  robozap-net:
    driver: bridge
